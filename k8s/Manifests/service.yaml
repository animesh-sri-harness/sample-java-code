apiVersion: v1
kind: Service
metadata:
  name: {{.Values.name}}
  labels:
    app: {{.Values.name}}
spec:
  type: {{.Values.serviceType}}
  ports:
    - name: http
      port: {{int .Values.servicePort}}
      targetPort: {{int .Values.serviceTargetPort}}
      protocol: TCP
  selector:
    app: {{.Values.name}}
