apiVersion: v1
kind: Service
metadata:
  name: demo-java-maven
  namespace: {{.Values.namespace}}
  labels:
    app.kubernetes.io/name: demo-java-maven
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: demo-java-maven
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: http
