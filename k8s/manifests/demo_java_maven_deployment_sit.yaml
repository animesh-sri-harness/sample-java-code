apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-java-maven
  namespace: {{.Values.namespace}}
  labels:
    app.kubernetes.io/name: demo-java-maven
    app.kubernetes.io/component: application
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-java-maven
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-java-maven
        app.kubernetes.io/component: application
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: nexus-aws-docker-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-java-maven
          image: <+artifact.image>
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "9000"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"
            - name: APP_ENVIRONMENT
              value: "<+env.name>"
            - name: APP_VERSION
              value: "<+artifact.tag>"
            # The root filesystem is read-only, so keep the H2 database on the
            # writable /tmp volume instead of the default ./data under /app.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:h2:file:/tmp/data/harness-demo;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
